<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PlacementOS — Campus Placement Management Platform</title>
    <meta name="description" content="PlacementOS digitizes the entire college placement lifecycle — from company onboarding to final offer acceptance. Smart eligibility, real-time pipeline tracking, and built-in assessments." />
    <meta name="keywords" content="campus placement, college recruitment, placement management system, TPO software, student placement portal" />
    <meta name="author" content="PlacementOS" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://placementos.example.edu/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://placementos.example.edu/" />
    <meta property="og:title" content="PlacementOS — Campus Placement Management Platform" />
    <meta property="og:description" content="A unified platform connecting students, recruiters, and placement offices — from eligibility checks to offer letters." />
    <meta property="og:image" content="https://placementos.example.edu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="PlacementOS" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://placementos.example.edu/" />
    <meta name="twitter:title" content="PlacementOS — Campus Placement Management Platform" />
    <meta name="twitter:description" content="A unified platform connecting students, recruiters, and placement offices — from eligibility checks to offer letters." />
    <meta name="twitter:image" content="https://placementos.example.edu/og-image.png" />

    <!-- Theme + PWA-ish basics -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Performance: preconnect to API and font/CDN origins -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
